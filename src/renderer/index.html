<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Word Template Filler</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>

<body>

    <!--
        ไอคอนใช้ inline SVG (stroke: currentColor) จึงเปลี่ยนสีตามสถานะเมนูได้
        และไม่ต้องพึ่ง font/ไอคอนภายนอก
    -->

    <aside class="sidebar">

        <div class="sidebar-brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path>
                    <path d="M14 3v5h5"></path>
                    <path d="M9 13h6M9 17h4"></path>
                </svg>
            </span>

            <span class="brand-text">
                <strong>Word Template</strong>
                <small>Filler</small>
            </span>
        </div>

        <nav class="sidebar-nav">

            <div
                class="menu-item active"
                data-page="report"
            >
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path>
                    <path d="M14 3v5h5"></path>
                    <path d="M9 12h6M9 16h6"></path>
                </svg>
                <span class="menu-text">รายงาน</span>
            </div>

            <div
                class="menu-item"
                data-page="master"
                aria-controls="masterSubmenu"
                aria-expanded="false"
            >
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3.2"></circle>
                    <path d="M12 3.5v2.2M12 18.3v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M3.5 12h2.2M18.3 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"></path>
                </svg>
                <span class="menu-text">ประวัติและการตั้งค่า</span>
                <svg class="menu-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6 9.5l6 6 6-6"></path>
                </svg>
            </div>

            <div
                class="submenu"
                id="masterSubmenu"
            >
                <div class="submenu-inner">

                    <div
                        class="menu-item"
                        data-page="template-config"
                    >
                        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                            <path d="M3 9.5h18M9.5 9.5V20"></path>
                        </svg>
                        <span class="menu-text">ตั้งค่าแม่แบบ</span>
                    </div>

                    <div
                        class="menu-item"
                        data-page="master-data"
                    >
                        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <ellipse cx="12" cy="6" rx="7.5" ry="3"></ellipse>
                            <path d="M4.5 6v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"></path>
                            <path d="M4.5 12v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"></path>
                        </svg>
                        <span class="menu-text">ข้อมูลหลัก</span>
                    </div>

                    <div
                        class="menu-item"
                        data-page="word-suggest"
                    >
                        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M9.5 18.5h5M10.5 21.5h3"></path>
                            <path d="M12 2.5a6.5 6.5 0 0 1 4 11.6c-.6.5-1 1.2-1 2v.4h-6v-.4c0-.8-.4-1.5-1-2a6.5 6.5 0 0 1 4-11.6z"></path>
                        </svg>
                        <span class="menu-text">คลังคำศัพท์</span>
                    </div>

                    <div
                        class="menu-item"
                        data-page="history"
                    >
                        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="8.5"></circle>
                            <path d="M12 7.5V12l3.2 2"></path>
                        </svg>
                        <span class="menu-text">ประวัติ</span>
                    </div>
                </div>
            </div>
        </nav>
    </aside>

    <div
        class="main"
        id="mainContent"
    ></div>


    <!--
        Dependency
        jszip -> modules -> components -> db -> app
    -->

    <!-- jszip ถูก vendor ไว้ในโปรเจกต์ ไม่ต้องพึ่ง CDN -->
    <script src="./vendor/jszip.min.js"></script>

    <!--
        พจนานุกรมไทย (.dic/.aff ที่ dictionary/) ถูกแปลงเป็น JS ตอน dev/build
        ใช้ <script> เพราะ .exe เปิดหน้าด้วย file:// แล้ว fetch ไฟล์ในเครื่องไม่ได้
    -->
    <script src="./dictionary/th_TH.js"></script>

    <!-- xlsx.js ใช้ JSZip ประกอบ/อ่านไฟล์ .xlsx จึงต้องโหลดหลัง jszip -->
    <script src="./xlsx.js"></script>

    <script src="./extract.js"></script>
    <script src="./replace.js"></script>
    <script src="./textMeasure.js"></script>
    <script src="./fieldTypes.js"></script>
    <script src="./wordSuggest.js"></script>

    <script src="./components/formPage.js"></script>
    <script src="./components/sidebar.js"></script>
    <script src="./components/reportPage.js"></script>
    <script src="./components/templateConfigPage.js"></script>
    <script src="./components/masterDataPage.js"></script>
    <script src="./components/wordSuggestPage.js"></script>
    <script src="./components/historyPage.js"></script>
    <script src="./components/masterLookup.js"></script>
    <script src="./components/previewDialog.js"></script>
    <script src="./components/datePicker.js"></script>
    <script src="./components/selectMenu.js"></script>
    <script src="./components/suggestMenu.js"></script>

    <script src="./db.js"></script>
    <script src="./app.js"></script>

</body>

</html>
